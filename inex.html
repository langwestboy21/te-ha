<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Điểm</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    width:350px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#0070f3;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056c7;
}

#result{
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">
    <h2>Tra Cứu Điểm</h2>

    <input type="text" id="sbd" placeholder="Nhập số báo danh">

    <button onclick="traDiem()">Tra cứu</button>

    <div id="result"></div>
</div>

<script>
const data = {
    "123456": {
        ten: "Nguyễn Văn A",
        toan: 8.5,
        van: 7.5,
        anh: 9
    },
    "654321": {
        ten: "Trần Thị B",
        toan: 9,
        van: 8,
        anh: 8.5
    }
};

function traDiem(){
    const sbd = document.getElementById("sbd").value.trim();
    const result = document.getElementById("result");

    if(data[sbd]){
        result.innerHTML = `
            <h3>${data[sbd].ten}</h3>
            <p>Toán: ${data[sbd].toan}</p>
            <p>Văn: ${data[sbd].van}</p>
            <p>Anh: ${data[sbd].anh}</p>
        `;
    }else{
        result.innerHTML = "<p>Không tìm thấy số báo danh!</p>";
    }
}
</script>

</body>
</html>
